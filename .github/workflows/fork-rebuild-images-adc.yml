name: Rebuild cascade PostHog images (ADC sandbox runners)

# Rebuilds every image cascade's self-hosted PostHog uses
# (deployment/ev2/cascade.posthog/images.lock.json) from this fork's mirror branches.
# Benchmark copy of fork-rebuild-images.yml: build jobs run on the ADC sandbox runner scale set
# (adc-docker-large: 8 vCPU / 16 GiB / 160 GiB). The original workflow is left unchanged.
# Pushing is off by default so this copy never overwrites the images the original publishes.
on:
  workflow_dispatch:
    inputs:
      posthog_ref:
        description: Ref of this repo to build from (mirror of PostHog/posthog master)
        default: main
      rust_node_container_ref:
        description: Ref of the rust-node-container fork to build the posthog-node base image from
        default: main
      platforms:
        description: Target platforms (multi-arch uses QEMU and is very slow)
        default: linux/amd64
      push:
        description: Push images to ghcr.io (overwrites the tags published by the original workflow)
        type: boolean
        default: false
      posthog_only:
        description: Build only the main PostHog image
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-rebuild-images-adc
  cancel-in-progress: false

env:
  RNC_REPO: tmacam/posthog-rust-node-container

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
      registry: ${{ steps.resolve.outputs.registry }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.posthog_ref }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "Building PostHog/posthog @ ${sha}" >> "$GITHUB_STEP_SUMMARY"

  rust-node-container:
    needs: prepare
    if: ${{ !inputs.posthog_only }}
    runs-on: adc-docker-large
    timeout-minutes: 90
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - &record-disk-baseline
        name: Record disk usage baseline
        run: |
          set -euo pipefail
          used=$(df -B1 --output=used / | tail -n 1 | tr -d ' ')
          echo "DISK_BASELINE_USED_BYTES=${used}" >> "$GITHUB_ENV"
          echo "Disk used on / before checkout: $(numfmt --to=iec-i --suffix=B "$used")"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RNC_REPO }}
          ref: ${{ inputs.rust_node_container_ref }}
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          persist-credentials: false
      - id: meta
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
        run: |
          set -euo pipefail
          rust=$(grep -E '^[[:space:]]*RUST_VERSION=' Dockerfile | head -1 | cut -d'=' -f2)
          node=$(grep -E '^ENV NODE_VERSION=' Dockerfile | head -1 | cut -d'=' -f2)
          echo "image=${REGISTRY}/rust-node-container:bookworm_rust_${rust}-node_${node}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: ${{ inputs.platforms != 'linux/amd64' }}
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          build-args: DEBIAN_SUITE=bookworm
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=adc-rust-node-container
          cache-to: type=gha,mode=max,scope=adc-rust-node-container
      - &report-build-resources
        name: Report Docker build peak memory and disk
        if: always()
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          echo "### Docker build resources" >> "$GITHUB_STEP_SUMMARY"
          container="buildx_buildkit_${BUILDER}0"
          if [[ -n "$BUILDER" ]] && pid=$(docker inspect --format '{{.State.Pid}}' "$container") && (( pid > 0 )); then
            cgroup=$(awk -F: '$1 == "0" {print $3}' "/proc/${pid}/cgroup")
            if [[ -n "$cgroup" ]]; then
              {
                echo "| BuildKit cgroup metric | Bytes | Human-readable |"
                echo "|---|---:|---:|"
              } >> "$GITHUB_STEP_SUMMARY"
              for metric in memory.peak memory.swap.peak; do
                if bytes=$(sudo cat "/sys/fs/cgroup${cgroup}/${metric}"); then
                  echo "| \`${metric}\` | ${bytes} | $(numfmt --to=iec-i --suffix=B "$bytes") |" | tee -a "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::BuildKit ${metric} is unavailable on this runner."
                  echo "| \`${metric}\` | Unavailable | Unavailable |" >> "$GITHUB_STEP_SUMMARY"
                fi
              done
            else
              echo "::warning::BuildKit cgroup v2 path is unavailable."
              echo "BuildKit peak memory unavailable: no cgroup v2 path." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::BuildKit container is not running; peak memory is unavailable."
            echo "BuildKit peak memory unavailable: builder not running." >> "$GITHUB_STEP_SUMMARY"
          fi
          df -h /
          used=$(df -B1 --output=used / | tail -n 1 | tr -d ' ')
          if [[ -n "${DISK_BASELINE_USED_BYTES:-}" ]]; then
            delta="$(numfmt --to=iec-i --suffix=B -- $(( used - DISK_BASELINE_USED_BYTES )))"
          else
            delta="unknown (no baseline)"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Additional disk used on / since before checkout, after Docker build: **${delta}**" | tee -a "$GITHUB_STEP_SUMMARY"

  posthog-node:
    # Dockerfile.node is based on ghcr.io/posthog/rust-node-container; repoint it at our build.
    needs: [prepare, rust-node-container]
    if: ${{ !inputs.posthog_only }}
    runs-on: adc-docker-large
    timeout-minutes: 120
    steps:
      - *record-disk-baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Repoint base image
        env:
          BASE_IMAGE: ${{ needs.rust-node-container.outputs.image }}
        run: |
          set -euo pipefail
          sed -i -E "s#^FROM ghcr\.io/posthog/rust-node-container:[^ ]+#FROM ${BASE_IMAGE}#" Dockerfile.node
          grep -n '^FROM' Dockerfile.node
          grep -q "^FROM ${BASE_IMAGE}" Dockerfile.node
      - uses: docker/setup-qemu-action@v3
        if: ${{ inputs.platforms != 'linux/amd64' }}
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.node
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          build-args: COMMIT_HASH=${{ needs.prepare.outputs.sha }}
          tags: |
            ${{ needs.prepare.outputs.registry }}/posthog-node:latest
            ${{ needs.prepare.outputs.registry }}/posthog-node:sha-${{ needs.prepare.outputs.short }}
      - *report-build-resources

  posthog:
    needs: prepare
    runs-on: adc-docker-large
    timeout-minutes: 180
    steps:
      - name: Report build resources
        run: |
          set -euo pipefail
          nproc
          free -h
          df -hT / /mnt
          docker info --format 'Docker root directory: {{ .DockerRootDir }}'
      - name: Add swap with a disk-space guard
        continue-on-error: true
        run: |
          set -euo pipefail
          available_kib=$(df -Pk / | awk 'NR == 2 {print $4}')
          if (( available_kib < 80 * 1024 * 1024 )); then
            echo "::error::At least 80 GiB of free disk is required before allocating 16 GiB of swap."
            exit 1
          fi
          sudo fallocate -l 16G /posthog-build.swap
          sudo chmod 600 /posthog-build.swap
          sudo mkswap /posthog-build.swap
          sudo swapon /posthog-build.swap
          free -h
          df -h /
      - *record-disk-baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        if: ${{ inputs.platforms != 'linux/amd64' }}
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          # No sourcemaps upload secret is provided, so the Dockerfile skips the upload stage.
          build-args: |
            COMMIT_HASH=${{ needs.prepare.outputs.sha }}
            GITHUB_ACTIONS=true
            GITHUB_SHA=${{ needs.prepare.outputs.sha }}
            GITHUB_REPOSITORY=PostHog/posthog
            GITHUB_SERVER_URL=https://github.com
          tags: |
            ${{ needs.prepare.outputs.registry }}/posthog:latest
            ${{ needs.prepare.outputs.registry }}/posthog:sha-${{ needs.prepare.outputs.short }}
      - *report-build-resources
      - name: Report final build resources
        if: always()
        continue-on-error: true
        run: |
          free -h
          sudo dmesg --ctime | tail -n 60

  rust:
    # Mirrors the entries for these images in .github/rust-images.yml.
    needs: prepare
    if: ${{ !inputs.posthog_only }}
    runs-on: adc-docker-large
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: capture
          - image: property-defs-rs
          - image: feature-flags
            sqlx_databases: persons behavioral-cohorts
          - image: hypercache-server
    steps:
      - *record-disk-baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # Mirrors upstream _rust-build-images.yml: the crates expect PROTO_ROOT=../proto inside the ./rust context.
      - name: Copy proto files into rust build context
        run: cp -r proto rust/proto
      - uses: docker/setup-qemu-action@v3
        if: ${{ inputs.platforms != 'linux/amd64' }}
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ./rust/
          file: ./rust/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          build-args: |
            BIN=${{ matrix.image }}
            SQLX_DATABASES=${{ matrix.sqlx_databases || '' }}
          tags: |
            ${{ needs.prepare.outputs.registry }}/${{ matrix.image }}:master
            ${{ needs.prepare.outputs.registry }}/${{ matrix.image }}:sha-${{ needs.prepare.outputs.short }}
          cache-from: type=gha,scope=adc-rust-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=adc-rust-${{ matrix.image }}
      - *report-build-resources

  livestream:
    needs: prepare
    if: ${{ !inputs.posthog_only }}
    runs-on: adc-docker-large
    timeout-minutes: 60
    steps:
      - *record-disk-baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: livestream
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        if: ${{ inputs.platforms != 'linux/amd64' }}
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ./livestream/
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: |
            ${{ needs.prepare.outputs.registry }}/livestream:master
            ${{ needs.prepare.outputs.registry }}/livestream:sha-${{ needs.prepare.outputs.short }}
          cache-from: type=gha,scope=adc-livestream
          cache-to: type=gha,mode=max,scope=adc-livestream
      - *report-build-resources

  summary:
    needs: [prepare, rust-node-container, posthog-node, posthog, rust, livestream]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          R: ${{ needs.prepare.outputs.registry }}
          S: ${{ needs.prepare.outputs.short }}
        run: |
          {
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| rust-node-container | ${{ needs.rust-node-container.result }} |"
            echo "| posthog-node | ${{ needs.posthog-node.result }} |"
            echo "| posthog | ${{ needs.posthog.result }} |"
            echo "| rust (capture, property-defs-rs, feature-flags, hypercache-server) | ${{ needs.rust.result }} |"
            echo "| livestream | ${{ needs.livestream.result }} |"
            echo ""
            echo "Images: \`${R}/<name>:sha-${S}\`"
          } >> "$GITHUB_STEP_SUMMARY"

